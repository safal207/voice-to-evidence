[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voice-to-evidence"
version = "0.1.0"
description = "Structured evidence intake layer for AI-agent safety review."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "voice-to-evidence contributors" }]
keywords = ["ai-safety", "agent-audit", "evidence", "intake"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
voice-to-evidence = "voice_to_evidence.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_to_evidence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
